<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="favicon.jpg">
</head>

<body>
    <aside class="sidebar">
        <a href="#home">
            <button class="nav-button active" data-section="home">
                <div class="logo-image">
                    <img src="image/logo.jpg" alt="logo Picture">
                </div>
            </button>
            <nav>
                <a href="#home">
                    <button class="nav-button active" data-section="home">
                        <i data-lucide="house">⌂</i>
                        <span>Home</span>
                    </button>
                </a>
                <a href="#about">
                    <button class="nav-button" data-section="about">
                        <i data-lucide="user">♙</i>
                        <span>About</span>
                    </button>
                </a>
                <a href="#projects">
                    <button class="nav-button" data-section="projects">
                        <i data-lucide="folder">▣</i>

                    <button class="nav-button" data-section="engineering">

                    </button>
                </a>
                <a href="#experience">
                    <button class="nav-button" data-section="experience">
                        <i data-lucide="briefcase">◷</i>

                    </button>
                </a>
                <a href="#certifications">
                    <button class="nav-button" data-section="certifications">
                        <i data-lucide="award">◆</i>
                        <span>Certifications</span>
                    </button>
                </a>

                    <button class="nav-button" data-section="contact">
                        <i data-lucide="mail">✉</i>
                        <span>Contact</span>
                    </button>
                </a>
            </nav>
            <script src="https://unpkg.com/lucide@latest"></script>

            <script>
                lucide.createIcons();
            </script>
    </aside>
    <main class="main-content">
        <p class="introduction">
        <h3>👋👋👋</h3>
        <h3>I'm</h3>
        <h1> Tyobista Tefera</h1>
        <h3>Mechanical Engineer student | Aerospace & Robotics Enthusiast | Developer</h3>
        <h4>Coding, building, and collecting hobbies like my inventory has infinite storage.</h4>
        </p>
        <div class="home-content">
            <div class="home-content1">
                <a href="#about">
                    <button class="button button-primary" data-go="projects">View my work ↗</button>
                </a>
            </div>
            <div class="home-content2">
                <a href="#contact">
                    <button class="button button-ghost" data-go="contact">Let's connect ✉</button>
                </a>
            </div>
        </div>

    <script src="script.js"></script>
